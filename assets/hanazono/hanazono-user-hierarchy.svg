<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="865" viewBox="0 0 1400 865" role="img" aria-labelledby="title desc"><title id="title">Hanazono 使用者層級邏輯</title><desc id="desc">園區總覽、單棟 Villa、樓層平面圖及單點空間體驗四層導覽，以及共用浮層的返回關係。</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8" fill="#847551"/></marker><marker id="back" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="#89918c"/></marker></defs><rect width="1400" height="865" fill="#faf9f4"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="40" y="47" font-size="28" fill="#244237" font-weight="700">HANAZONO / 使用者層級邏輯</text><text x="40" y="80" font-size="17" fill="#434a4f" >從園區到室內，讓使用者知道目前位置、下一步入口，以及如何返回。</text><text x="1360" y="46" font-size="12" fill="#847551" text-anchor="end">01 / INFORMATION ARCHITECTURE</text><rect x="40" y="105" width="1320" height="48" rx="3" fill="#eaece3" stroke="none" /><text x="60" y="136" font-size="17" fill="#244237" >起點：開場影片結束 → 進入園區總覽</text><rect x="40" y="180" width="300" height="44" rx="3" fill="#244237" stroke="none" /><text x="58" y="208" font-size="16" fill="#fff" >第一層</text><text x="322" y="208" font-size="12" fill="#d3c595" text-anchor="end">LEVEL 1</text><rect x="40" y="245" width="300" height="84" rx="3" fill="#fff" stroke="#847551" /><text x="190" y="280" font-size="22" fill="#244237" font-weight="700" text-anchor="middle">園區總覽</text><text x="190" y="308" font-size="14" fill="#586357" text-anchor="middle">14 個建築標記與園區探索</text><rect x="40" y="397" width="300" height="192" rx="3" fill="#f0f0e8" stroke="#d8dbd0" /><text x="60" y="431" font-size="17" fill="#244237" font-weight="700">園區探索</text><text x="60" y="465" font-size="14" fill="#434a4f" >· 環境：季節與時段切換</text><text x="60" y="495" font-size="14" fill="#434a4f" >· 內容：特色景點、照片與影片</text><text x="60" y="525" font-size="14" fill="#434a4f" >· A1–A4 / B1–B5</text><text x="60" y="555" font-size="14" fill="#434a4f" >· C1–C4 / CH（Clubhouse）</text><path d="M342 287H364" fill="none" stroke="#847551" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M355 178V604" stroke="#ccd0c7" stroke-dasharray="4 6"/><rect x="370" y="180" width="300" height="44" rx="3" fill="#244237" stroke="none" /><text x="388" y="208" font-size="16" fill="#fff" >第二層</text><text x="652" y="208" font-size="12" fill="#d3c595" text-anchor="end">LEVEL 2</text><rect x="370" y="245" width="300" height="84" rx="3" fill="#fff" stroke="#847551" /><text x="520" y="280" font-size="22" fill="#244237" font-weight="700" text-anchor="middle">單棟 Villa</text><text x="520" y="308" font-size="14" fill="#586357" text-anchor="middle">點選建築，查看資訊與入口</text><rect x="370" y="397" width="300" height="192" rx="3" fill="#f0f0e8" stroke="#d8dbd0" /><text x="390" y="431" font-size="17" fill="#244237" font-weight="700">建築資訊</text><text x="390" y="465" font-size="14" fill="#434a4f" >· Villa 名稱與快速介紹</text><text x="390" y="495" font-size="14" fill="#434a4f" >· 樓層平面圖入口</text><text x="390" y="525" font-size="14" fill="#434a4f" >· 虛擬空間體驗入口</text><text x="390" y="555" font-size="14" fill="#434a4f" >· 保留目前選取的 Villa</text><path d="M672 287H694" fill="none" stroke="#847551" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M685 178V604" stroke="#ccd0c7" stroke-dasharray="4 6"/><path d="M520 329V360H190V331" fill="none" stroke="#89918c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#back)"/><rect x="700" y="180" width="300" height="44" rx="3" fill="#244237" stroke="none" /><text x="718" y="208" font-size="16" fill="#fff" >第三層</text><text x="982" y="208" font-size="12" fill="#d3c595" text-anchor="end">LEVEL 3</text><rect x="700" y="245" width="300" height="84" rx="3" fill="#fff" stroke="#847551" /><text x="850" y="280" font-size="22" fill="#244237" font-weight="700" text-anchor="middle">樓層平面圖</text><text x="850" y="308" font-size="14" fill="#586357" text-anchor="middle">選擇 1–4 樓，定位個別空間</text><rect x="700" y="397" width="300" height="192" rx="3" fill="#f0f0e8" stroke="#d8dbd0" /><text x="720" y="431" font-size="17" fill="#244237" font-weight="700">樓層與定位</text><text x="720" y="465" font-size="14" fill="#434a4f" >· 樓層切換：1F / 2F / 3F / 4F</text><text x="720" y="495" font-size="14" fill="#434a4f" >· 空間標記：跳轉對應空間</text><text x="720" y="525" font-size="14" fill="#434a4f" >· 視角 ICON：查看實際照片</text><text x="720" y="555" font-size="14" fill="#434a4f" >· 保留 Villa 與樓層選取</text><path d="M1002 287H1024" fill="none" stroke="#847551" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M1015 178V604" stroke="#ccd0c7" stroke-dasharray="4 6"/><path d="M850 329V360H520V331" fill="none" stroke="#89918c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#back)"/><rect x="1030" y="180" width="300" height="44" rx="3" fill="#244237" stroke="none" /><text x="1048" y="208" font-size="16" fill="#fff" >第四層</text><text x="1312" y="208" font-size="12" fill="#d3c595" text-anchor="end">LEVEL 4</text><rect x="1030" y="245" width="300" height="84" rx="3" fill="#fff" stroke="#847551" /><text x="1180" y="280" font-size="22" fill="#244237" font-weight="700" text-anchor="middle">單點空間體驗</text><text x="1180" y="308" font-size="14" fill="#586357" text-anchor="middle">進入室內空間並查看內容</text><rect x="1030" y="397" width="300" height="192" rx="3" fill="#f0f0e8" stroke="#d8dbd0" /><text x="1050" y="431" font-size="17" fill="#244237" font-weight="700">體驗與查閱</text><text x="1050" y="465" font-size="14" fill="#434a4f" >· 快速介紹與房間規格</text><text x="1050" y="495" font-size="14" fill="#434a4f" >· 即時位置與自動導覽</text><text x="1050" y="525" font-size="14" fill="#434a4f" >· 切換空間 / 查閱視角照片</text><text x="1050" y="555" font-size="14" fill="#434a4f" >· 關閉浮層回到原畫面</text><path d="M1180 329V360H850V331" fill="none" stroke="#89918c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#back)"/><text x="700" y="384" font-size="13" fill="#67716a" text-anchor="middle">返回上一層：空間 → 樓層 → Villa → 園區</text><text x="40" y="645" font-size="21" fill="#244237" font-weight="700">共用浮層邏輯</text><text x="40" y="677" font-size="15" fill="#434a4f" >浮層不建立新的導覽層級；關閉後保留原本的位置。</text><rect x="40" y="703" width="400" height="85" rx="3" fill="#fff" stroke="#aeb5a7" /><text x="240" y="737" font-size="18" fill="#244237" font-weight="700" text-anchor="middle">目前畫面</text><text x="240" y="765" font-size="15" fill="#586357" text-anchor="middle">園區 / Villa / 樓層 / 空間</text><path d="M446 747H493" fill="none" stroke="#847551" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="500" y="703" width="400" height="85" rx="3" fill="#e8e8dc" stroke="#aeb5a7" /><text x="700" y="737" font-size="18" fill="#244237" font-weight="700" text-anchor="middle">開啟對應浮層</text><text x="700" y="765" font-size="15" fill="#586357" text-anchor="middle">Menu、平面圖、照片或影片</text><path d="M906 747H953" fill="none" stroke="#847551" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="960" y="703" width="400" height="85" rx="3" fill="#fff" stroke="#aeb5a7" /><text x="1160" y="737" font-size="18" fill="#244237" font-weight="700" text-anchor="middle">關閉並返回</text><text x="1160" y="765" font-size="15" fill="#586357" text-anchor="middle">回原畫面，保留目前選取</text><text x="40" y="834" font-size="14" fill="#847551" >實線：進入 / 開啟　　虛線：返回上一層</text><text x="1360" y="834" font-size="13" fill="#687166" text-anchor="end">依現有原型與介面設定整理</text></g></svg>
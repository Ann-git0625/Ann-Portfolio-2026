<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="865" aria-labelledby="title desc" viewBox="0 0 1400 865"><title id="title"></title><desc id="desc"></desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path fill="#847551" d="m0 0 8 4-8 4"/></marker><marker id="back" markerHeight="6" markerWidth="6" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path fill="#89918c" d="m0 0 8 4-8 4"/></marker></defs><path fill="#faf9f4" d="M0 0h1400v865H0z"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="40" y="47" fill="#254136" font-size="28" font-weight="700">HANAZONO / 使用者層級邏輯</text><text x="40" y="80" fill="#434a4f" font-size="17">從園區到室內，讓使用者知道目前位置、下一步入口，以及如何返回。</text><text x="1360" y="46" fill="#847551" font-size="12" text-anchor="end"></text><rect width="1320" height="48" x="40" y="105" fill="#eaece3" rx="3"/><text x="60" y="136" fill="#254136" font-size="17">起點：開場影片結束 → 進入園區總覽</text><rect width="300" height="44" x="40" y="180" fill="#254136" rx="3"/><text x="58" y="208" fill="#fff" font-size="16">第一層</text><text x="322" y="208" fill="#d3c595" font-size="12" text-anchor="end">LEVEL 1</text><rect width="300" height="84" x="40" y="245" fill="#fff" stroke="#847551" rx="3"/><text x="190" y="280" fill="#254136" font-size="22" font-weight="700" text-anchor="middle">園區總覽</text><text x="190" y="308" fill="#586357" font-size="14" text-anchor="middle">14 個建築標記與園區探索</text><rect width="300" height="192" x="40" y="397" fill="#f0f0e8" stroke="#d8dbd0" rx="3"/><text x="60" y="431" fill="#254136" font-size="17" font-weight="700">園區探索</text><text x="60" y="465" fill="#434a4f" font-size="14">· 環境：季節與時段切換</text><text x="60" y="495" fill="#434a4f" font-size="14">· 內容：特色景點、照片與影片</text><text x="60" y="525" fill="#434a4f" font-size="14">· A1–A4 / B1–B5</text><text x="60" y="555" fill="#434a4f" font-size="14">· C1–C4 / CH（Clubhouse）</text><path fill="none" stroke="#847551" stroke-width="1.8" marker-end="url(#arrow)" d="M342 287h22"/><path stroke="#ccd0c7" stroke-dasharray="4 6" d="M355 178v426"/><rect width="300" height="44" x="370" y="180" fill="#254136" rx="3"/><text x="388" y="208" fill="#fff" font-size="16">第二層</text><text x="652" y="208" fill="#d3c595" font-size="12" text-anchor="end">LEVEL 2</text><rect width="300" height="84" x="370" y="245" fill="#fff" stroke="#847551" rx="3"/><text x="520" y="280" fill="#254136" font-size="22" font-weight="700" text-anchor="middle">單棟 Villa</text><text x="520" y="308" fill="#586357" font-size="14" text-anchor="middle">點選建築，查看資訊與入口</text><rect width="300" height="192" x="370" y="397" fill="#f0f0e8" stroke="#d8dbd0" rx="3"/><text x="390" y="431" fill="#254136" font-size="17" font-weight="700">建築資訊</text><text x="390" y="465" fill="#434a4f" font-size="14">· Villa 名稱與快速介紹</text><text x="390" y="495" fill="#434a4f" font-size="14">· 樓層平面圖入口</text><text x="390" y="525" fill="#434a4f" font-size="14">· 虛擬空間體驗入口</text><text x="390" y="555" fill="#434a4f" font-size="14">· 保留目前選取的 Villa</text><path fill="none" stroke="#847551" stroke-width="1.8" marker-end="url(#arrow)" d="M672 287h22"/><path stroke="#ccd0c7" stroke-dasharray="4 6" d="M685 178v426"/><path fill="none" stroke="#89918c" stroke-dasharray="6 5" stroke-width="1.8" marker-end="url(#back)" d="M520 329v31H190v-29"/><rect width="300" height="44" x="700" y="180" fill="#254136" rx="3"/><text x="718" y="208" fill="#fff" font-size="16">第三層</text><text x="982" y="208" fill="#d3c595" font-size="12" text-anchor="end">LEVEL 3</text><rect width="300" height="84" x="700" y="245" fill="#fff" stroke="#847551" rx="3"/><text x="850" y="280" fill="#254136" font-size="22" font-weight="700" text-anchor="middle">樓層平面圖</text><text x="850" y="308" fill="#586357" font-size="14" text-anchor="middle">選擇 1–4 樓，定位個別空間</text><rect width="300" height="192" x="700" y="397" fill="#f0f0e8" stroke="#d8dbd0" rx="3"/><text x="720" y="431" fill="#254136" font-size="17" font-weight="700">樓層與定位</text><text x="720" y="465" fill="#434a4f" font-size="14">· 樓層切換：1F / 2F / 3F / 4F</text><text x="720" y="495" fill="#434a4f" font-size="14">· 空間標記：跳轉對應空間</text><text x="720" y="525" fill="#434a4f" font-size="14">· 視角 ICON：查看實際照片</text><text x="720" y="555" fill="#434a4f" font-size="14">· 保留 Villa 與樓層選取</text><path fill="none" stroke="#847551" stroke-width="1.8" marker-end="url(#arrow)" d="M1002 287h22"/><path stroke="#ccd0c7" stroke-dasharray="4 6" d="M1015 178v426"/><path fill="none" stroke="#89918c" stroke-dasharray="6 5" stroke-width="1.8" marker-end="url(#back)" d="M850 329v31H520v-29"/><rect width="300" height="44" x="1030" y="180" fill="#254136" rx="3"/><text x="1048" y="208" fill="#fff" font-size="16">第四層</text><text x="1312" y="208" fill="#d3c595" font-size="12" text-anchor="end">LEVEL 4</text><rect width="300" height="84" x="1030" y="245" fill="#fff" stroke="#847551" rx="3"/><text x="1180" y="280" fill="#254136" font-size="22" font-weight="700" text-anchor="middle">單點空間體驗</text><text x="1180" y="308" fill="#586357" font-size="14" text-anchor="middle">進入室內空間並查看內容</text><rect width="300" height="192" x="1030" y="397" fill="#f0f0e8" stroke="#d8dbd0" rx="3"/><text x="1050" y="431" fill="#254136" font-size="17" font-weight="700">體驗與查閱</text><text x="1050" y="465" fill="#434a4f" font-size="14">· 快速介紹與房間規格</text><text x="1050" y="495" fill="#434a4f" font-size="14">· 即時位置與自動導覽</text><text x="1050" y="525" fill="#434a4f" font-size="14">· 切換空間 / 查閱視角照片</text><text x="1050" y="555" fill="#434a4f" font-size="14">· 關閉浮層回到原畫面</text><path fill="none" stroke="#89918c" stroke-dasharray="6 5" stroke-width="1.8" marker-end="url(#back)" d="M1180 329v31H850v-29"/><text x="700" y="384" fill="#67716a" font-size="13" text-anchor="middle">返回上一層：空間 → 樓層 → Villa → 園區</text><text x="40" y="645" fill="#254136" font-size="21" font-weight="700">共用浮層邏輯</text><text x="40" y="677" fill="#434a4f" font-size="15">浮層不建立新的導覽層級；關閉後保留原本的位置。</text><rect width="400" height="85" x="40" y="703" fill="#fff" stroke="#aeb5a7" rx="3"/><text x="240" y="737" fill="#254136" font-size="18" font-weight="700" text-anchor="middle">目前畫面</text><text x="240" y="765" fill="#586357" font-size="15" text-anchor="middle">園區 / Villa / 樓層 / 空間</text><path fill="none" stroke="#847551" stroke-width="1.8" marker-end="url(#arrow)" d="M446 747h47"/><rect width="400" height="85" x="500" y="703" fill="#e8e8dc" stroke="#aeb5a7" rx="3"/><text x="700" y="737" fill="#254136" font-size="18" font-weight="700" text-anchor="middle">開啟對應浮層</text><text x="700" y="765" fill="#586357" font-size="15" text-anchor="middle">Menu、平面圖、照片或影片</text><path fill="none" stroke="#847551" stroke-width="1.8" marker-end="url(#arrow)" d="M906 747h47"/><rect width="400" height="85" x="960" y="703" fill="#fff" stroke="#aeb5a7" rx="3"/><text x="1160" y="737" fill="#254136" font-size="18" font-weight="700" text-anchor="middle">關閉並返回</text><text x="1160" y="765" fill="#586357" font-size="15" text-anchor="middle">回原畫面，保留目前選取</text><text x="40" y="834" fill="#847551" font-size="14">實線：進入 / 開啟　　虛線：返回上一層</text><text x="1360" y="834" fill="#687166" font-size="13" text-anchor="end">依現有原型與介面設定整理</text></g></svg>
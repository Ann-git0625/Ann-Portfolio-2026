><text x="254" y="208" fill="#434a4f" font-size="10" text-anchor="middle">平面圖</text></g><text x="500" y="840" fill="#434a4f" font-size="14">顯示即時位置並提供自動導覽。</text><text x="500" y="865" fill="#687166" font-size="14">返回樓層；保留同一棟 Villa 的脈絡。</text><text x="40" y="565" fill="#254136" font-size="20" font-weight="700">06  視角照片浮層</text><g transform="translate(40 585)"><rect width="400" height="225" fill="#e5e7e1" stroke="#6e7870" rx="3"/><path stroke="#c3c7c1" d="m1 1 398 223m0-223L1 224"/><text x="13" y="22" fill="#434a4f" font-size="10" font-weight="700">ONE HANAZONO</text><rect width="43" height="20" x="345" y="10" fill="#fcfcfc" stroke="#a9b0a6" rx="3"/><text x="366.5" y="24" fill="#434a4f" font-size="10" text-anchor="middle">MENU</text><rect width="400" height="225" fill="#a7afa4" rx="3"/><rect width="318" height="172" x="41" y="26" fill="#fcfcfc" stroke="#899682" rx="3"/><text x="57" y="47" fill="#434a4f" font-size="12">視角照片</text><text x="338" y="47" fill="#434a4f" font-size="18">×</text><rect width="284" height="103" x="58" y="58" fill="#e1e4dd" stroke="#c0c8b8" rx="3"/><path stroke="#c3c7c1" d="m58 58 284 103m0-103L58 161"/><text x="200" y="116" fill="#6e7867" font-size="12" text-anchor="middle">對應平面圖 ICON 的實際照片</text><text x="71" y="185" fill="#434a4f" font-size="21">‹</text><text x="327" y="185" fill="#434a4f" font-size="21">›</text><text x="200" y="182" fill="#6e7867" font-size="11" text-anchor="middle">01 / 04</text></g><text x="40" y="840" fill="#434a4f" font-size="14">從平面圖 ICON 查看對應實際照片。</text><text x="40" y="865" fill="#687166" font-size="14">關閉照片後回到原平面圖。</text><text x="40" y="990" fill="#254136" font-size="20" font-weight="700">07  主選單浮層</text><g transform="translate(40 1010)"><rect width="400" height="225" fill="#e5e7e1" stroke="#6e7870" rx="3"/><path stroke="#c3c7c1" d="m1 1 398 223m0-223L1 224"/><text x="13" y="22" fill="#434a4f" font-size="10" font-weight="700">ONE HANAZONO</text><rect width="43" height="20" x="345" y="10" fill="#fcfcfc" stroke="#a9b0a6" r
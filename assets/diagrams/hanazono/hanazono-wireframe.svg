ext><text x="960" y="475" fill="#687166" font-size="14">可前往平面圖或虛擬空間體驗。</text><text x="960" y="565" fill="#254136" font-size="20" font-weight="700">04  樓層平面圖</text><g transform="translate(960 585)"><rect width="400" height="225" fill="#e5e7e1" stroke="#6e7870" rx="3"/><path stroke="#c3c7c1" d="m1 1 398 223m0-223L1 224"/><text x="13" y="22" fill="#434a4f" font-size="10" font-weight="700">ONE HANAZONO</text><rect width="43" height="20" x="345" y="10" fill="#fcfcfc" stroke="#a9b0a6" rx="3"/><text x="366.5" y="24" fill="#434a4f" font-size="10" text-anchor="middle">MENU</text><rect width="272" height="151" x="53" y="36" fill="#fcfcfc" stroke="#aeb7a8" rx="3"/><text x="68" y="55" fill="#434a4f" font-size="11" font-weight="700">VILLA A1 / 1F</text><text x="305" y="54" fill="#434a4f" font-size="17">×</text><path fill="none" stroke="#889381" stroke-width="2" d="M90 68h190v102H90Zm60 0v39m0 14v49m60-102v68m0 14v20M90 118h44m28 0h48m0-20h70m-70 47h70"/><circle cx="116" cy="90" r="8" fill="#847551" stroke="#847551"/><text x="116" y="94" fill="#fff" font-size="10" text-anchor="middle">1</text><circle cx="180" cy="146" r="8" fill="#dce0d6" stroke="#847551"/><text x="180" y="150" fill="#434a4f" font-size="10" text-anchor="middle">◎</text><circle cx="246" cy="123" r="8" fill="#dce0d6" stroke="#847551"/><text x="246" y="127" fill="#434a4f" font-size="10" text-anchor="middle">◎</text><rect width="40" height="20" x="344" y="57" fill="#847551" stroke="#a9b0a6" rx="3"/><text x="364" y="71" fill="#fff" font-size="10" text-anchor="middle">1F</text><rect width="40" height="20" x="344" y="86" fill="#fcfcfc" stroke="#a9b0a6" rx="3"/><text x="364" y="100" fill="#434a4f" font-size="10" text-anchor="middle">2F</text><rect width="40" height="20" x="344" y="115" fill="#fcfcfc" stroke="#a9b0a6" rx="3"/><text x="364" y="129" fill="#434a4f" font-size="10" text-anchor="middle">3F</text><rect width="40" height="20" x="344" y="144" fill="#fcfcfc" stroke="#a9b0a6" rx="3"/><text x="364" y="158" fill="#434
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1370" aria-labelledby="title desc" viewBox="0 0 1400 1370"><title id="title">Hanazono Wireframe 與畫面流程</title><desc id="desc">八個低擬真畫面示意：開場、園區、Villa、樓層、空間、視角照片、選單和多媒體查閱；標示主要進入及返回關係。</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path fill="#847551" d="m0 0 8 4-8 4"/></marker></defs><path fill="#faf9f4" d="M0 0h1400v1370H0z"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="40" y="47" fill="#254136" font-size="28" font-weight="700">HANAZONO / UI Wireframe</text><text x="40" y="80" fill="#434a4f" font-size="17">依現有原型重整的低擬真配置：場景滿版、Logo 左上、Menu 右側、操作列置底。</text><text x="1360" y="46" fill="#847551" font-size="12" text-anchor="end"></text><rect width="1320" height="36" x="40" y="104" fill="#eaece3" rx="3"/><text x="58" y="128" fill="#254136" font-size="14">主路徑 01 → 02 → 03 → 04 → 05　｜　06 視角照片、07 選單與 08 多媒體為對應浮層</text><text x="40" y="175" fill="#254136" font-size="20" font-weight="700">01  開場影片</text><g transform="translate(40 195)"><rect width="400" height="225" fill="#e5e7e1" stroke="#6e7870" rx="3"/><path stroke="#c3c7c1" d="m1 1 398 223m0-223L1 224"/><text x="200" y="100" fill="#434a4f" font-size="18" text-anchor="middle">ONE HANAZONO VILLAS</text><text x="200" y="124" fill="#687166" font-size="13" text-anchor="middle">園區開場影片</text><path stroke="#bbc2b5" d="M36 200h328"/><path stroke="#847551" stroke-width="3" d="M36 200h202"/></g><text x="40" y="450" fill="#434a4f" font-size="14">影片結束後進入園區總覽。</text><text x="40" y="475" fill="#687166" font-size="14">先建立場域印象，再開啟探索。</text><text x="500" y="175" fill="#254136" font-size="20" font-weight="700">02  園區總覽</text><g transform="translate(500 195)"><rect width="400" height="225" fill="#e5e7e1" stroke="#6e7870" rx="3"/><path stroke="#c3c7c1" d="m1 1 398 223m0-223L1 224"/><text x="13" y="22" fill="#434a4f" font-size="10" font-weight="700">ONE HANAZONO</text><rect width="43" height="20" x